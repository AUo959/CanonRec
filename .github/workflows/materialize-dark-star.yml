name: Materialize Dark Star unified narrative

on:
  push:
    branches:
      - canon/dark-star-unified-v1-1
    paths:
      - tools/materialize_dark_star.py
      - tools/dark_star_payload_00.b64
      - tools/dark_star_payload_01.b64
      - tools/dark_star_payload_02.b64
      - tools/dark_star_payload_03.b64
      - tools/dark_star_payload_04.b64
      - tools/dark_star_payload_05.b64
      - tools/dark_star_payload_06.b64
      - .github/workflows/materialize-dark-star.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canon/dark-star-unified-v1-1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize manuscript and update graph
        run: python tools/materialize_dark_star.py
      - name: Verify manuscript
        run: |
          test -s canon/L2/narratives/GUMAS_L2__NARRATIVE__DARK_STAR_ARC_UNIFIED__v1.1__2026-07-22.md
          grep -q "status: canon" canon/L2/narratives/GUMAS_L2__NARRATIVE__DARK_STAR_ARC_UNIFIED__v1.1__2026-07-22.md
          grep -q "translation_recording_policy" canon/L2/events/event_dark_star_incident_4718_224.json
      - name: Remove one-time materializer
        run: |
          rm tools/materialize_dark_star.py
          rm tools/dark_star_payload_00.b64
          rm tools/dark_star_payload_01.b64
          rm tools/dark_star_payload_02.b64
          rm tools/dark_star_payload_03.b64
          rm tools/dark_star_payload_04.b64
          rm tools/dark_star_payload_05.b64
          rm tools/dark_star_payload_06.b64
          rm .github/workflows/materialize-dark-star.yml
      - name: Commit generated canon update
        run: |
          git config user.name "Aurora Canon Materializer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "canon(L2): promote unified Dark Star narrative v1.1" || exit 0
          git push origin HEAD:canon/dark-star-unified-v1-1
