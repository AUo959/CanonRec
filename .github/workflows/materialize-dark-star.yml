name: Materialize Dark Star unified narrative

on:
  push:
    branches:
      - canon/dark-star-unified-v1-1
    paths:
      - tools/materialize_dark_star.py
      - tools/dark_star_bz2_*.b64
      - .github/workflows/materialize-dark-star.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canon/dark-star-unified-v1-1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize manuscript and update graph
        id: materialize
        continue-on-error: true
        run: python tools/materialize_dark_star.py
      - name: Persist payload diagnostics on failure
        if: steps.materialize.outcome == 'failure'
        run: |
          git config user.name "Aurora Canon Materializer"
          git config user.email "actions@users.noreply.github.com"
          git add tools/dark_star_payload_diagnostics.json
          git commit -m "ci(canonrec): record Dark Star payload diagnostics" || true
          git push origin HEAD:canon/dark-star-unified-v1-1
          exit 1
      - name: Verify manuscript
        run: |
          test -s canon/L2/narratives/GUMAS_L2__NARRATIVE__DARK_STAR_ARC_UNIFIED__v1.1__2026-07-22.md
          grep -q "status: canon" canon/L2/narratives/GUMAS_L2__NARRATIVE__DARK_STAR_ARC_UNIFIED__v1.1__2026-07-22.md
          grep -q "translation_recording_policy" canon/L2/events/event_dark_star_incident_4718_224.json
      - name: Remove one-time materializer and transport files
        run: |
          rm -f tools/materialize_dark_star.py
          rm -f tools/dark_star_payload_*.b64
          rm -f tools/dark_star_payload_small_*.b64
          rm -f tools/dark_star_pack_*.b64
          rm -f tools/dark_star_bz2_*.b64
          rm -f tools/dark_star_payload_diagnostics.json
          rm -f .github/workflows/materialize-dark-star.yml
      - name: Commit generated canon update
        run: |
          git config user.name "Aurora Canon Materializer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "canon(L2): promote unified Dark Star narrative v1.1" || exit 0
          git push origin HEAD:canon/dark-star-unified-v1-1
